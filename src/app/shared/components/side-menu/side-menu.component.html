<button type="button" class="menu-toggle" (click)="hiddenMenu()" [attr.aria-expanded]="isOpen" aria-label="Abrir ou fechar menu">
  <img src="/assets/icons/menu-svgrepo-com.svg" alt="" />
</button>
<div class="menu-backdrop" [class.visible]="isOpen" (click)="hiddenMenu()" aria-hidden="true"></div>
<aside class="menu-panel" [class.expanded]="isOpen" aria-label="Menu de administração">
  <div class="menu-brand">
    <img *ngIf="!isOpen" src="/assets/images/logo_branco.png" alt="CondoConnect" class="brand-mark" />
    <img *ngIf="isOpen" src="/assets/images/logo_texto.png" alt="CondoConnect" class="brand-wordmark" />
  </div>
  <nav class="menu-navigation" aria-label="Seções do painel">
    <button type="button" *ngFor="let item of menuItems" class="menu-item"
      [class.active]="router.url === '/' + item.url"
      [attr.title]="!isOpen ? item.title : null"
      (click)="changeScreen(item.url)">
      <img [src]="'/assets/icons/' + item.icon + '.svg'" alt="" />
      <span *ngIf="isOpen">{{ item.title }}</span>
    </button>
  </nav>
  <button type="button" class="menu-item menu-logout" (click)="logout()" [attr.title]="!isOpen ? 'Fazer logout' : null">
    <img src="/assets/icons/logout.svg" alt="" />
    <span *ngIf="isOpen">Fazer logout</span>
  </button>
</aside>
