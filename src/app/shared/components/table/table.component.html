<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
  <input type="text" [(ngModel)]="searchTerm" placeholder="Buscar..."
    class="w-full rounded-md border p-2 sm:max-w-sm" />

  <div *ngIf="btnText1" (click)="onButtonClick && onButtonClick()"
    class="flex h-10 w-full cursor-pointer items-center justify-center rounded-md bg-primary px-3 text-white shadow-md sm:w-auto">
    {{ btnText1 }}
  </div>
</div>

<p *ngIf="companyTable" class="table-swipe-hint">Deslize a tabela para os lados para ver todas as colunas.</p>
<div class="w-full overflow-x-auto" [class.company-scroll]="companyTable">
  <table class="min-w-[760px] !w-full rounded-lg border border-gray-300 bg-white shadow-md" [class.company-table]="companyTable">
    <thead>
      <tr class="bg-primary">
        <th *ngFor="let col of columns" class="border-b px-4 py-3 text-left">
          <button type="button" (click)="sortBy(col)"
            class="flex w-full items-center justify-between gap-2 text-left !text-white">
            <span>{{ capitalizeFirstLetter(col) }}</span>
            <span class="text-xs leading-none opacity-90">{{ getSortIcon(col) }}</span>
          </button>
        </th>
        <th class="border-b px-4 py-3 text-left !text-white">Ações</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let row of paginatedData(); let i = index"
        [ngClass]="{ 'bg-gray-100': i % 2 === 0, 'bg-white': i % 2 !== 0 }">
        <td *ngFor="let col of columns" class="border-b px-4 py-2">
          <ng-container [ngSwitch]="col">
            <button *ngSwitchCase="'trocar_condominio'" type="button"
              class="rounded bg-blue-700 px-2 py-1 text-sm text-white"
              (click)="onTrocarCondominio && onTrocarCondominio(row)">
              Trocar condomínio
            </button>

            <span *ngSwitchDefault>
              {{ formatStatus(row[col]) }}
            </span>
          </ng-container>
        </td>

        <td class="border-b px-4 py-2" [class.company-action-cell]="companyTable" [class.flex]="!companyTable" [class.flex-wrap]="!companyTable" [class.gap-2]="!companyTable">
          <ng-container *ngIf="companyTable">
            <button *ngIf="onEdit" type="button" (click)="onEdit(row)" class="rounded bg-primary px-2 py-1 text-sm text-white">{{ editLabel }}</button>
            <button *ngIf="onTrocarCondominio" type="button" (click)="onTrocarCondominio(row)" class="rounded bg-blue-700 px-2 py-1 text-sm text-white">Trocar condomínio</button>
            <button *ngIf="onToggleStatus" type="button" (click)="onToggleStatus(row)" [ngClass]="getToggleClass(row)">{{ getToggleLabel(row) }}</button>
          </ng-container>
          <button *ngIf="onQrCode" (click)="onQrCode(row)"
            class="rounded bg-emerald-700 px-2 py-1 text-sm text-white">
            QR Code
          </button>

          <button *ngIf="!companyTable && onToggleStatus" (click)="onToggleStatus(row)" [ngClass]="getToggleClass(row)">
            {{ getToggleLabel(row) }}
          </button>

          <button *ngIf="onCustomAction" (click)="onCustomAction(row)"
            class="rounded bg-blue-700 px-2 py-1 text-sm text-white">
            Ver pagamentos
          </button>

          <button *ngIf="!companyTable && onEdit" (click)="onEdit(row)" class="rounded bg-primary px-2 py-1 text-sm text-white">
            {{ editLabel }}
          </button>

          <button *ngIf="onDelete" (click)="onDelete(row)" class="rounded bg-red-700 px-2 py-1 text-sm text-white">
            Excluir
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
  <label class="flex items-center gap-2 text-sm text-gray-600">
    Itens por página
    <select [ngModel]="pageSize" (ngModelChange)="changePageSize($event)"
      class="rounded-md border border-gray-300 bg-white px-2 py-1">
      <option *ngFor="let option of pageSizeOptions" [ngValue]="option">
        {{ option }}
      </option>
    </select>
  </label>

  <div class="flex items-center justify-between gap-3 sm:justify-end">
    <button (click)="prevPage()" [disabled]="currentPage === 1"
      class="rounded-md bg-gray-300 px-4 py-2 disabled:cursor-not-allowed disabled:opacity-50">
      Anterior
    </button>

    <span class="whitespace-nowrap text-sm">Página {{ currentPage }} de {{ totalPages() }}</span>

    <button (click)="nextPage()" [disabled]="currentPage >= totalPages()"
      class="rounded-md bg-gray-300 px-4 py-2 disabled:cursor-not-allowed disabled:opacity-50">
      Próximo
    </button>
  </div>
</div>
