<div class="cc-table-toolbar">
  <input type="text" [(ngModel)]="searchTerm" placeholder="Buscar..." aria-label="Buscar na tabela"
    class="cc-input" />

  <button *ngIf="btnText1" type="button" (click)="onButtonClick && onButtonClick()"
    class="cc-btn cc-btn-primary">
    {{ btnText1 }}
  </button>
</div>

<p *ngIf="companyTable" class="table-swipe-hint">Deslize a tabela para os lados para ver todas as colunas.</p>
<div class="cc-table-wrap" [class.company-scroll]="companyTable"
  [attr.tabindex]="companyTable ? 0 : null"
  [attr.aria-label]="companyTable ? 'Tabela de empresas. Use as setas para ver todas as colunas.' : null">
  <table class="cc-table min-w-[640px]" [class.company-table]="companyTable">
    <thead>
      <tr>
        <th *ngFor="let col of columns">
          <button type="button" (click)="sortBy(col)"
            class="flex w-full items-center justify-between gap-2 text-left">
            <span>{{ capitalizeFirstLetter(col) }}</span>
            <span class="text-xs leading-none opacity-90">{{ getSortIcon(col) }}</span>
          </button>
        </th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let row of paginatedData()">
        <td *ngFor="let col of columns">
          <ng-container [ngSwitch]="col">
            <button *ngSwitchCase="'trocar_condominio'" type="button"
              class="cc-btn cc-btn-secondary cc-btn-sm"
              (click)="onTrocarCondominio && onTrocarCondominio(row)">
              Trocar condomínio
            </button>

            <span *ngSwitchDefault>
              {{ displayValue(row, col) }}
            </span>
          </ng-container>
        </td>

        <td [class.company-action-cell]="companyTable">
          <div class="cc-actions" [class.cc-actions-nowrap]="companyTable">
            <ng-container *ngIf="companyTable">
              <button *ngIf="onEdit" type="button" (click)="onEdit(row)" class="cc-btn cc-btn-primary cc-btn-sm">{{ editLabel }}</button>
              <button *ngIf="onTrocarCondominio" type="button" (click)="onTrocarCondominio(row)" class="cc-btn cc-btn-secondary cc-btn-sm">Trocar condomínio</button>
              <button *ngIf="onToggleStatus" type="button" (click)="onToggleStatus(row)" [ngClass]="getToggleClass(row)">{{ getToggleLabel(row) }}</button>
            </ng-container>

            <button *ngIf="onQrCode" type="button" (click)="onQrCode(row)" class="cc-btn cc-btn-secondary cc-btn-sm">
              QR Code
            </button>

            <button *ngIf="!companyTable && onToggleStatus" type="button" (click)="onToggleStatus(row)" [ngClass]="getToggleClass(row)">
              {{ getToggleLabel(row) }}
            </button>

            <button *ngIf="onCustomAction" type="button" (click)="onCustomAction(row)" class="cc-btn cc-btn-secondary cc-btn-sm">
              Ver pagamentos
            </button>

            <button *ngIf="!companyTable && onEdit" type="button" (click)="onEdit(row)" class="cc-btn cc-btn-primary cc-btn-sm">
              {{ editLabel }}
            </button>

            <button *ngIf="onDelete" type="button" (click)="onDelete(row)" class="cc-btn cc-btn-danger cc-btn-sm">
              Excluir
            </button>
          </div>
        </td>
      </tr>
      <tr *ngIf="!paginatedData().length">
        <td class="cc-empty" [attr.colspan]="columns.length + 1">Nenhum registro encontrado.</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="cc-table-footer">
  <label class="flex items-center gap-2">
    Itens por página
    <select [ngModel]="pageSize" (ngModelChange)="changePageSize($event)"
      class="cc-input cc-input-auto">
      <option *ngFor="let option of pageSizeOptions" [ngValue]="option">
        {{ option }}
      </option>
    </select>
  </label>

  <div class="flex items-center justify-between gap-3 sm:justify-end">
    <button type="button" (click)="prevPage()" [disabled]="currentPage === 1"
      class="cc-btn cc-btn-ghost">
      Anterior
    </button>

    <span class="whitespace-nowrap">Página {{ currentPage }} de {{ totalPages() }}</span>

    <button type="button" (click)="nextPage()" [disabled]="currentPage >= totalPages()"
      class="cc-btn cc-btn-ghost">
      Próximo
    </button>
  </div>
</div>
