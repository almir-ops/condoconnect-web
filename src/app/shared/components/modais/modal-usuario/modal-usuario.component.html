<div class="p-6 bg-white rounded-lg shadow-lg max-w-md w-full">
  <h2 class="text-xl font-semibold text-gray-800 mb-4">
    {{ editMode ? 'Editando Usuario' : 'Adicionar Usuario' }}
  </h2>
  <p class="text-gray-600 mb-4">
    Complete o formulario corretamente e clique em adicionar.
  </p>

  <div class="mb-4">
    <label for="nomeSubcategoria" class="block text-sm font-medium text-gray-700">
      Nome
    </label>
    <input
      id="nomeSubcategoria"
      type="text"
      [(ngModel)]="nome"
      class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
      placeholder="Digite o nome"
    />
  </div>

  <div class="mb-4">
    <label for="categorias" class="block text-sm font-medium text-gray-700">
      Tipo
    </label>
    <select
      id="categorias"
      [(ngModel)]="tipo"
      class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
    >
      <option value="admin">Admin</option>
      <option value="cliente">Cliente</option>

    </select>
  </div>

 <div class="mb-4">
    <label for="categorias" class="block text-sm font-medium text-gray-700">
      Status
    </label>
    <select
      id="categorias"
      [(ngModel)]="status"
      class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
    >
      <option value="ativo">Ativo</option>
      <option value="inativo">Inativo</option>
      <option value="bloqueado">Bloqueado</option>

    </select>
  </div>

  <div class="mb-4">
    <label for="usuario-email" class="block text-sm font-medium text-gray-700">
      Email
    </label>
    <input
      id="usuario-email"
      type="email"
      appEmailLowercase inputmode="email" autocapitalize="off" [spellcheck]="false"
      [(ngModel)]="email"
      class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
      placeholder="Digite o email"
    />
  </div>

  <div class="mb-4">
    <label for="nomeSubcategoria" class="block text-sm font-medium text-gray-700">
      Telefone com DDD {{ editMode ? '' : '(obrigatório)' }}
    </label>
    <input
      id="telefone-usuario"
      type="tel"
      [ngModel]="telefone"
      (ngModelChange)="telefone = formatPhone($event); phoneError = ''"
      (blur)="validarTelefone()"
      [required]="!editMode"
      [attr.aria-invalid]="!!phoneError"
      [attr.aria-describedby]="phoneError ? 'telefone-usuario-erro' : null"
      inputmode="tel"
      autocomplete="tel"
      class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
      placeholder="(11) 99999-9999"
    />
  </div>

  <p id="telefone-usuario-erro" *ngIf="phoneError" role="alert" class="text-sm text-red-600">{{ phoneError }}</p>
  <p *ngIf="editMode && !usuario.telefone" class="text-sm text-gray-600">
    Cadastro antigo sem telefone. Complete o contato quando disponível; o acesso permanece liberado.
  </p>
  <div class="mb-4" *ngIf="editMode && empresasDisponiveis.length">
    <label for="empresaVinculada" class="block text-sm font-medium text-gray-700">
      Vincular empresa
    </label>
    <select
      id="empresaVinculada"
      [(ngModel)]="empresaSelecionadaId"
      class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
    >
      <option [ngValue]="null">Nenhuma</option>
      <option *ngFor="let empresa of empresasDisponiveis" [ngValue]="empresa.id">
        {{ empresa.nome }}
      </option>
    </select>
    <p class="mt-1 text-xs text-gray-500">
      Este usuário ainda não tem empresa vinculada.
    </p>
  </div>

  <div class="mb-4 relative" *ngIf="!editMode">
    <label for="categorias" class="block text-sm font-medium text-gray-700">
      Senha
    </label>
    <input
      id="custom-input"
      type="text"
      [type]="!hiddenPassword ? 'password' : 'text'"
      [(ngModel)]="password"
      placeholder=" "
      class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
    />
    <div
    (click)="viewPassword()"
    class="absolute top-[12px] right-3 cursor-pointer mt-5">
    <img
      *ngIf="hiddenPassword"
      src="./assets/icon/eye-slash.svg"
      class="h-5">
    <img
      *ngIf="!hiddenPassword"
      src="./assets/icon/eye.svg"
      class="h-5">
    </div>
  </div>

  <div class="flex justify-end space-x-2 mt-4">
    <button (click)="fechar()" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md">
      Fechar
    </button>
    <button *ngIf="!editMode" (click)="salvar()" class="px-4 py-2 bg-primary text-white rounded-md">
      Adicionar
    </button>
    <button *ngIf="editMode" (click)="update()" class="px-4 py-2 bg-primary text-white rounded-md">
      Atualizar
    </button>
  </div>
</div>
