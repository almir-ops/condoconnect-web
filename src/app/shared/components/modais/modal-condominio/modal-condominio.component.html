<div class="bg-white rounded-lg shadow-lg w-full max-h-[90dvh] overflow-y-auto">
  <div class="sticky top-0 z-10 bg-white border-b border-gray-200 px-6 py-4">
    <h2 class="text-xl font-semibold text-gray-800">
      {{ editMode ? 'Editar Condomínio' : 'Adicionar Condomínio' }}
    </h2>

    <p class="text-gray-600 text-sm mt-1">
      {{
      editMode
      ? 'Altere as informações necessárias e clique em salvar.'
      : 'Complete o formulário corretamente e clique em adicionar.'
      }}
    </p>
  </div>

  <div class="px-6 py-5">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="md:col-span-2">
        <label class="cc-label">
          Nome<span class="text-red-700 ml-2">*</span>
        </label>
        <input type="text" [(ngModel)]="nome"
          class="cc-input"
          placeholder="Digite o nome do condomínio" />
      </div>

      <div>
        <label class="cc-label">
          Email
        </label>
        <input type="email" appEmailLowercase inputmode="email" autocapitalize="off" [spellcheck]="false" [(ngModel)]="email"
          class="cc-input"
          placeholder="Digite o email" />
      </div>

      <div>
        <label class="cc-label">
          Telefone
        </label>
        <input type="text" [(ngModel)]="telefone"
          class="cc-input"
          placeholder="Digite o telefone" />
      </div>

      <div>
        <label class="cc-label">
          CEP<span class="text-red-700 ml-2">*</span>
        </label>
        <input type="text" [(ngModel)]="cep" (keyup.enter)="buscarEndereco()"
          class="cc-input"
          placeholder="Digite o CEP e pressione Enter" />
      </div>

      <div>
        <label class="cc-label">
          Estado<span class="text-red-700 ml-2">*</span>
        </label>
        <input type="text" [(ngModel)]="estado"
          class="cc-input"
          placeholder="Digite o estado" />
      </div>

      <div class="md:col-span-2">
        <label class="cc-label">
          Rua<span class="text-red-700 ml-2">*</span>
        </label>
        <input type="text" [(ngModel)]="endereco"
          class="cc-input"
          placeholder="Digite a rua" />
      </div>

      <div>
        <label class="cc-label">
          Número<span class="text-red-700 ml-2">*</span>
        </label>
        <input type="text" [(ngModel)]="numero"
          class="cc-input"
          placeholder="Digite o número" />
      </div>

      <div>
        <label class="cc-label">
          Bairro<span class="text-red-700 ml-2">*</span>
        </label>
        <input type="text" [(ngModel)]="bairro"
          class="cc-input"
          placeholder="Digite o bairro" />
      </div>

      <div class="md:col-span-2">
        <label class="cc-label">
          Cidade<span class="text-red-700 ml-2">*</span>
        </label>
        <input type="text" [(ngModel)]="cidade"
          class="cc-input"
          placeholder="Digite a cidade" />
      </div>
    </div>
  </div>

  <div class="sticky bottom-0 bg-white border-t border-gray-200 px-6 py-4 flex justify-end space-x-2">
    <button type="button" (click)="fechar()" class="cc-btn cc-btn-ghost">
      Fechar
    </button>

    <button type="button" (click)="salvar()" class="cc-btn cc-btn-primary">
      {{ editMode ? 'Salvar alterações' : 'Adicionar' }}
    </button>
  </div>
</div>
