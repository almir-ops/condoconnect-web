<div class="cc-modal">
  <h2 class="text-xl font-semibold text-gray-800">
    {{ editMode ? 'Editando Plano' : 'Adicionar Plano' }}
  </h2>

  <p class="text-gray-600 mb-4">
    {{ editMode ? 'Edite o plano como desejar e clique em salvar.' : 'Complete o formulario corretamente e clique em
    adicionar.' }}
  </p>

  <!-- Nome -->
  <div class="mb-2">
    <label for="nomePlano" class="cc-label">
      Nome
    </label>
    <input id="nomePlano" type="text" [(ngModel)]="nome"
      class="cc-input"
      placeholder="Digite o nome do plano" />
  </div>

  <!-- Valor -->
  <div class="mb-4">
    <label for="valorPlano" class="cc-label">
      Valor
    </label>
    <input id="valorPlano" type="number" [(ngModel)]="valor"
      class="cc-input"
      placeholder="Ex.: 99.90" />
  </div>

  <!-- Ciclo -->
  <div class="mb-4">
    <label for="cicloPlano" class="cc-label">
      Ciclo de pagamento
    </label>
    <select id="cicloPlano" [(ngModel)]="pagamento_ciclo"
      class="cc-input">
      <option value="WEEKLY">Semanal</option>
      <option value="BIWEEKLY">Quinzenal</option>
      <option value="MONTHLY">Mensal</option>
      <option value="QUARTERLY">Trimestral</option>
      <option value="SEMIANNUALLY">Semestral</option>
      <option value="YEARLY">Anual</option>
    </select>
  </div>

  <!-- Toggle Trial -->
  <div class="mb-3 mt-2 flex items-center gap-2">
    <input id="trialEnabled" type="checkbox" [(ngModel)]="trial_enabled"
      class="w-4 h-4 border-gray-300 rounded cursor-pointer" />
    <label for="trialEnabled" class="text-sm text-gray-700 cursor-pointer">
      Habilitar período de teste (trial)
    </label>
  </div>

  <!-- Dias de Trial -->
  <div class="mb-4" *ngIf="trial_enabled">
    <label for="diasTrial" class="cc-label">
      Dias de trial
    </label>
    <input id="diasTrial" type="number" min="1" [(ngModel)]="trial_days"
      class="cc-input"
      placeholder="Ex.: 14" />
    <div class="text-xs text-gray-500 mt-1">Informe a duração do período de teste.</div>
  </div>

  <!-- Descrição -->
  <div class="w-full">
    <label for="descPlano" class="cc-label">Descrição do plano</label>
    <textarea id="descPlano" rows="4" [(ngModel)]="descricao" (input)="atualizarContagem()"
      class="cc-input"
      placeholder="Descrição curta do plano (até 150 caracteres)"></textarea>
    <div class="text-xs text-gray-500 mt-1">
      {{ caracteresRestantes }}/150 caracteres restantes
    </div>
  </div>

  <!-- Ações -->
  <div class="flex justify-end space-x-2 mt-4">
    <button (click)="fechar()" class="cc-btn cc-btn-ghost">
      Fechar
    </button>
    <button *ngIf="editMode" (click)="update()" class="cc-btn cc-btn-primary">
      Salvar
    </button>
    <button *ngIf="!editMode" (click)="salvar()" class="cc-btn cc-btn-primary">
      Adicionar
    </button>
  </div>
</div>
