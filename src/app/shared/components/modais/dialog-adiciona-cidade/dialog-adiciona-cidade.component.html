<div class="cc-modal">
  <h2>Adicionar Cidade</h2>
  <p class="cc-modal-text">Escolha o estado e selecione a cidade na lista.</p>

  <div class="mb-4">
    <label class="cc-label" for="cidade-estado">Estado</label>
    <select id="cidade-estado" class="cc-input" [ngModel]="estado" (ngModelChange)="estado = $event; carregarMunicipios()">
      <option value="" disabled hidden>Selecione o estado</option>
      @for (uf of estados; track uf) {
        <option [ngValue]="uf">{{ uf }}</option>
      }
    </select>
  </div>

  <div class="mb-2">
    <label class="cc-label" for="cidade-nome">{{ carregando ? 'Carregando cidades...' : 'Cidade' }}</label>
    <select id="cidade-nome" class="cc-input" [(ngModel)]="nomeCidade" [disabled]="carregando || erroLista">
      <option value="" disabled hidden>Selecione a cidade</option>
      @for (cidade of municipios; track cidade) {
        <option [ngValue]="cidade" [disabled]="jaExiste(cidade)">{{ cidade }}{{ jaExiste(cidade) ? ' (já cadastrada)' : '' }}</option>
      }
    </select>
  </div>

  @if (jaCadastrada) {
    <p class="cc-alert cc-alert-error">A cidade {{ nomeCidade }} já está cadastrada.</p>
  }
  @if (erroLista) {
    <p class="cc-alert cc-alert-error">Não foi possível carregar as cidades. Feche e tente novamente.</p>
  }

  <div class="cc-actions-end">
    <button type="button" class="cc-btn cc-btn-ghost" (click)="fecharDialog()">Cancelar</button>
    <button type="button" class="cc-btn cc-btn-primary" (click)="adicionarCidade()" [disabled]="!nomeCidade || jaCadastrada">Adicionar</button>
  </div>
</div>
