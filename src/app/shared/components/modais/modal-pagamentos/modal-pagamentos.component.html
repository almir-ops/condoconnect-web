<div class="p-4">
  <div class="text-lg font-semibold mb-1" style="color:var(--cc-primary-dark)">
    Pagamentos da assinatura #{{ data?.subId }}
  </div>
  <div class="text-sm mb-4 text-gray-500">
    {{ data?.empresa }} — {{ data?.plano }}
  </div>

  <div class="cc-table-wrap">
    <table class="cc-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Vencimento</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of rows">
          <td>{{ p.id }}</td>
          <td>{{ p.dueDate }}</td>
          <td>R$ {{ p.value | number : '1.2-2' }}</td>
          <td>{{ p.status }}</td>
          <td>
            <a *ngIf="p.paymentLink" class="text-primary underline font-semibold" [href]="p.paymentLink" target="_blank">abrir</a>
            <span *ngIf="!p.paymentLink">—</span>
          </td>
        </tr>
        <tr *ngIf="!rows?.length">
          <td class="cc-empty" colspan="5">
            Nenhuma cobrança encontrada.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
