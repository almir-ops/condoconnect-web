<div class="p-6 bg-white rounded-lg shadow-lg max-w-md w-full">
  <h2 class="text-xl font-semibold text-gray-800 mb-4">Adicionar Empresa</h2>
  <p class="text-gray-600 mb-4">
    Complete o formulário corretamente e clique em adicionar.
  </p>

  <div class="mb-4">
    <label for="empresaNome" class="block text-sm font-medium text-gray-700">
      Nome *
    </label>
    <input
      id="empresaNome"
      type="text"
      [(ngModel)]="nome"
      class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
      placeholder="Digite o nome da empresa"
    />
  </div>

  <div class="mb-4">
    <label for="empresaEmail" class="block text-sm font-medium text-gray-700">
      Email *
    </label>
    <input
      id="empresaEmail"
      type="email"
      [(ngModel)]="email"
      class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
      placeholder="Digite o email"
    />
  </div>

  <div class="mb-4">
    <label for="empresaCnpj" class="block text-sm font-medium text-gray-700">
      CNPJ
    </label>
    <input
      id="empresaCnpj"
      type="text"
      [(ngModel)]="cnpj"
      class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
      placeholder="Digite o CNPJ"
    />
  </div>

  <div class="mb-4 grid grid-cols-2 gap-3">
    <div>
      <label for="empresaTelefone" class="block text-sm font-medium text-gray-700">
        Telefone
      </label>
      <input
        id="empresaTelefone"
        type="text"
        [(ngModel)]="telefone"
        class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
        placeholder="Telefone"
      />
    </div>

    <div>
      <label for="empresaCelular" class="block text-sm font-medium text-gray-700">
        Celular
      </label>
      <input
        id="empresaCelular"
        type="text"
        [(ngModel)]="celular"
        class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
        placeholder="Celular"
      />
    </div>
  </div>

  <div class="mb-4">
    <label for="empresaEndereco" class="block text-sm font-medium text-gray-700">
      Endereço
    </label>
    <input
      id="empresaEndereco"
      type="text"
      [(ngModel)]="endereco"
      class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
      placeholder="Rua, número"
    />
  </div>

  <div class="mb-4 grid grid-cols-3 gap-3">
    <div>
      <label for="empresaBairro" class="block text-sm font-medium text-gray-700">
        Bairro
      </label>
      <input
        id="empresaBairro"
        type="text"
        [(ngModel)]="bairro"
        class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
        placeholder="Bairro"
      />
    </div>

    <div>
      <label for="empresaCidade" class="block text-sm font-medium text-gray-700">
        Cidade
      </label>
      <input
        id="empresaCidade"
        type="text"
        [(ngModel)]="cidade"
        class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
        placeholder="Cidade"
      />
    </div>

    <div>
      <label for="empresaEstado" class="block text-sm font-medium text-gray-700">
        UF
      </label>
      <input
        id="empresaEstado"
        type="text"
        maxlength="2"
        [(ngModel)]="estado"
        class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 uppercase"
        placeholder="UF"
      />
    </div>
  </div>

  <div class="flex justify-end space-x-2 mt-4">
    <button (click)="fechar()" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md">
      Fechar
    </button>
    <button (click)="salvar()" class="px-4 py-2 bg-blue-500 text-white rounded-md" [disabled]="!nome || !email">
      Adicionar
    </button>
  </div>
</div>
