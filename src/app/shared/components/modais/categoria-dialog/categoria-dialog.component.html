<div class="cc-modal">
  <h2>{{ editMode ? 'Editar Categoria' : 'Adicionar Categoria' }}</h2>
  <p class="cc-modal-text">Digite o nome da categoria corretamente e clique em {{ editMode ? 'Atualizar' : 'Adicionar' }}.</p>

  <div class="mb-4">
    <label class="cc-label" for="categoria-nome">Categoria</label>
    <input id="categoria-nome" class="cc-input" [(ngModel)]="nomeCategorias" placeholder="Digite o nome" />
  </div>

  <div class="mb-1">
    <label class="cc-label" for="categoria-descricao">Descrição da categoria</label>
    <textarea id="categoria-descricao" class="cc-input" rows="4" [(ngModel)]="descricaoCategorias" (input)="atualizarContagem()" placeholder="Descreva a categoria"></textarea>
    <span class="cc-hint">{{ caracteresRestantes }}/150 caracteres restantes</span>
  </div>

  <div class="cc-actions-end">
    <button type="button" class="cc-btn cc-btn-ghost" (click)="fechar()">Fechar</button>
    <button type="button" class="cc-btn cc-btn-primary" (click)="salvar()">{{ editMode ? 'Atualizar' : 'Adicionar' }}</button>
  </div>
</div>
