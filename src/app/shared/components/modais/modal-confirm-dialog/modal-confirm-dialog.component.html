<div class="cc-modal">
  <h2>{{ data.titulo }}</h2>
  <p class="cc-modal-text">{{ data.mensagem }}</p>
  <div class="cc-actions-end">
    <button type="button" class="cc-btn cc-btn-ghost" (click)="fechar(false)">Não</button>
    <button type="button" class="cc-btn cc-btn-primary" (click)="fechar(true)">Sim</button>
  </div>
</div>
