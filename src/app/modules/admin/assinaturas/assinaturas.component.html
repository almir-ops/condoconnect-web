
<div class="cc-page">
  <div class="w-full">
    <header class="cc-page-header">
      <h1>Planos</h1>
      <p>Gerencie os planos presentes no aplicativo</p>
    </header>
    <div class="mt-4">
      <app-table
        class="w-full"
        [btnText1]="'Adicionar plano'"
        [columns]="columns"
        [data]="data"
        [onButtonClick]="handleButtonClick"
        [onEdit]="editarPlano"
        [onDelete]="excluirPlano"
      ></app-table>
    </div>
  </div>
</div>
