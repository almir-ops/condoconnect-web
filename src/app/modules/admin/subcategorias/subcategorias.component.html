<div class="cc-page">
  <div class="w-full">
    <header class="cc-page-header">
      <h1>Subcategorias</h1>
      <p>Gerencie as subcategorias presentes no aplicativo</p>
    </header>

    <div class="mt-4">
      <app-table class="w-full" [btnText1]="'Adicionar subcategoria'" [columns]="columns" [data]="data"
        [onButtonClick]="handleButtonClick" [onEdit]="editarSubCategorias"
        [onDelete]="excluirSubCategorias"></app-table>
    </div>
  </div>
</div>
