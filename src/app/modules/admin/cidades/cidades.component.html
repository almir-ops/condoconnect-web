<div class="cc-page">
  <div class="w-full">
    <header class="cc-page-header">
      <h1>Cidades</h1>
      <p>Gerencie as cidades presentes no aplicativo</p>
    </header>
    <div class="mt-4">
      <app-table
        class="w-full"
        [btnText1]="'Adicionar cidade'"
        [columns]="columns"
        [data]="data"
        [onButtonClick]="handleButtonClick"
        [onEdit]="editarCidade"
        [onDelete]="excluirCidade"
        ></app-table>
    </div>

  </div>
</div>
