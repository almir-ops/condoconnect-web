<div class="cc-page">
  <div class="w-full">
    <header class="cc-page-header">
      <h1>Empresas</h1>
      <p>Gerencie as empresas presentes no aplicativo</p>
    </header>

    <div class="cc-stats">
      <div class="cc-card cc-stat">
        <div class="text-sm text-gray-500">Total de empresas cadastradas</div>
        <div class="mt-2 text-2xl font-semibold text-gray-800">{{ totalEmpresas() }}</div>
      </div>

      <div class="cc-card cc-stat">
        <div class="text-sm text-gray-500">Total de empresas ativas</div>
        <div class="mt-2 text-2xl font-semibold text-gray-800">{{ totalEmpresasAtivas() }}</div>
      </div>
    </div>

    <div class="mt-4">
      <app-table class="block w-full min-w-0" [companyTable]="true" [btnText1]="'Adicionar empresa'" [columns]="columns" [data]="data"
        [onButtonClick]="handleButtonClick" [onEdit]="editarCard" editLabel="Editar card" [onToggleStatus]="toggleEmpresaStatus.bind(this)"
        [onTrocarCondominio]="abrirDialogTrocarCondominio.bind(this)"></app-table>
    </div>
  </div>
</div>

<div *ngIf="dialogTrocarCondominioAberto"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 px-4" (click)="!salvandoTroca && fecharDialogTrocarCondominio()">
  <div class="w-full max-w-md rounded-lg bg-white p-5 shadow-lg" (click)="$event.stopPropagation()">
    <div class="text-lg font-semibold text-gray-700">
      Trocar condomínio da empresa
    </div>

    <div class="text-sm text-gray-500 mt-1">
      Empresa:
      <strong>{{ empresaSelecionada?.nome }}</strong>
    </div>

    <div class="text-sm text-gray-500 mt-1" *ngIf="empresaSelecionada?.condominios?.length">
      Condomínio atual:
      <strong>{{ empresaSelecionada?.condominios[0]?.nome }}</strong>
    </div>

    <div class="mt-4">
      <label class="cc-label">
        Novo condomínio
      </label>

      <select [(ngModel)]="condominioSelecionadoId"
        class="cc-input">
        <option [ngValue]="null">
          Selecione um condomínio
        </option>

        <option *ngFor="let condominio of condominios" [ngValue]="condominio.id">
          {{ condominio.nome }}
        </option>
      </select>
    </div>

    <div class="flex justify-end gap-3 mt-5">
      <button type="button" class="cc-btn cc-btn-ghost" [disabled]="salvandoTroca"
        (click)="fecharDialogTrocarCondominio()">
        Cancelar
      </button>

      <button type="button" class="cc-btn cc-btn-primary"
        [disabled]="salvandoTroca || !condominioSelecionadoId" (click)="salvarTrocaCondominio()">
        {{ salvandoTroca ? 'Salvando...' : 'Salvar' }}
      </button>
    </div>
  </div>
</div>
