<div class="cc-page">
  <div class="w-full">
    <header class="cc-page-header">
      <h1>Categorias</h1>
      <p>Gerencie as categorias presentes no aplicativo</p>
    </header>
    <div class="mt-4">
      <app-table
        class="w-full"
        [btnText1]="'Adicionar categorias'"
        [columns]="columns"
        [data]="data"
        [onButtonClick]="handleButtonClick"
        [onEdit]="editarCategorias"
        [onDelete]="excluirCategorias"
      ></app-table>
    </div>
  </div>
</div>
