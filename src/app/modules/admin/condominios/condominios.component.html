<div class="w-full px-4 pt-5 text-gray-700 sm:px-6 lg:px-[70px]">
  <div class="w-full">
    <div>
      <div class="text-xl text-gray-700">Condominios</div>
      <div>Gerencie os condominios presentes no aplicativo</div>
    </div>

    <div class="mt-4">
      <app-table class="w-full" [btnText1]="'Adicionar condominio'" [columns]="columns" [data]="data"
        [onButtonClick]="handleButtonClick" [onEdit]="editarCondo" [onDelete]="excluirCondo"
        [onQrCode]="abrirQrCode"></app-table>
    </div>
  </div>
</div>
