<div class="cc-page">
  <div class="w-full">
    <header class="cc-page-header">
      <h1>Condomínios</h1>
      <p>Gerencie os condomínios presentes no aplicativo</p>
    </header>

    <div class="mt-4">
      <app-table class="w-full" [btnText1]="'Adicionar condomínio'" [columns]="columns" [data]="data"
        [onButtonClick]="handleButtonClick" [onEdit]="editarCondo" [onDelete]="excluirCondo"
        [onQrCode]="abrirQrCode"></app-table>
    </div>
  </div>
</div>
