<div class="cc-page">
  <div class="w-full">
    <header class="cc-page-header">
      <h1>Usuários</h1>
      <p>Gerencie os usuários presentes no aplicativo</p>
    </header>

    <div class="cc-stats">
      <div class="cc-card cc-stat">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div class="text-sm text-gray-500">Total de usuários carregados</div>
            <div class="mt-2 text-2xl font-semibold text-gray-800">{{ totalUsuarios() }}</div>
          </div>
          <button type="button"
            class="cc-icon-btn"
            (click)="abrirAjudaMetrica('Total de usuários carregados', 'Quantidade total de usuários retornados pela busca atual da API e carregados na tabela.')">
            ?
          </button>
        </div>
      </div>

      <div class="cc-card cc-stat">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div class="text-sm text-gray-500">Total de usuários ativos</div>
            <div class="mt-2 text-2xl font-semibold text-gray-800">{{ totalUsuariosAtivos() }}</div>
          </div>
          <button type="button"
            class="cc-icon-btn"
            (click)="abrirAjudaMetrica('Total de usuários ativos', 'Quantidade de usuários carregados que estão marcados como ativos pelo campo status ou ativo.')">
            ?
          </button>
        </div>
      </div>

      <div class="cc-card cc-stat sm:col-span-2 xl:col-span-1">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div class="text-sm text-gray-500">Novos usuários do mês atual</div>
            <div class="mt-2 text-2xl font-semibold text-gray-800">{{ totalUsuariosNovosMesAtual() }}</div>
          </div>
          <button type="button"
            class="cc-icon-btn"
            (click)="abrirAjudaMetrica('Novos usuários do mês atual', 'Quantidade de usuários carregados cuja data de criação está dentro do mês e ano atuais.')">
            ?
          </button>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <app-table
        class="w-full"
        [btnText1]="'Adicionar usuário'"
        [columns]="columns"
        [data]="data"
        [defaultSortColumn]="'createdAt'"
        [defaultSortDirection]="'desc'"
        [onButtonClick]="handleButtonClick"
        [onEdit]="editarUsuario"
      ></app-table>
    </div>
  </div>
</div>

<div *ngIf="selectedMetric" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4 transition-opacity" (click)="fecharAjudaMetrica()">
  <div class="w-full max-w-md rounded-lg bg-white p-5 shadow-xl" (click)="$event.stopPropagation()">
    <div class="flex items-start justify-between gap-4">
      <div class="text-lg font-semibold text-gray-800">{{ selectedMetric.title }}</div>
      <button type="button" class="text-xl leading-none text-gray-500" (click)="fecharAjudaMetrica()">
        ×
      </button>
    </div>

    <p class="mt-3 text-sm leading-6 text-gray-600">{{ selectedMetric.description }}</p>

    <div class="mt-5 flex justify-end">
      <button type="button" class="cc-btn cc-btn-primary" (click)="fecharAjudaMetrica()">
        Entendi
      </button>
    </div>
  </div>
</div>
